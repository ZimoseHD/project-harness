interface:
  display_name: "Project Harness"
  short_description: "Coordinate verified delivery with persistent stage telemetry"
  default_prompt: "Use $project-harness explicitly with role: delivery in a code-capable mode to coordinate Implementation, Closeout, Context Promotion, merge, persistent stage timing/change observations, and Issue closure; at the Context Promotion gate, summarize the exact proposal and finish the turn, then continue only from the user's explicit source-bound re-entry. Use role: init for project setup and an exact phase role only for compatibility or recovery."
policy:
  allow_implicit_invocation: false
